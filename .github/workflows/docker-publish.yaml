name: Publish docker images (hbbs / hbbr)

# 在 GitHub 上构建 hbbs、hbbr 两个镜像并推送到 ghcr.io，
# 同时产出 Windows 二进制（hbbs.exe / hbbr.exe）挂到 Release。
#
# 为什么用 scratch 做基础镜像：二进制是 musl 静态链接，无需 glibc；
# 镜像只有 6~10MB，且不依赖 Docker Hub（国内网络友好）。
#
# 触发：
#   - 推 X.Y.Z 格式 tag（与其它构建一致）
#   - 手动 workflow_dispatch

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-push:
    name: Build images (${{ matrix.job.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: amd64, target: x86_64-unknown-linux-musl, arch: amd64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build binaries (cross)
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=${{ matrix.job.target }}
          use-cross: true

      - name: Prepare docker context
        run: |
          mkdir -p docker/ctx-hbbs docker/ctx-hbbr
          cp target/${{ matrix.job.target }}/release/hbbs docker/ctx-hbbs/hbbs
          cp target/${{ matrix.job.target }}/release/hbbr docker/ctx-hbbr/hbbr
          chmod +x docker/ctx-hbbs/hbbs docker/ctx-hbbr/hbbr

          cat > docker/ctx-hbbs/Dockerfile <<'EOF'
          FROM scratch
          COPY hbbs /usr/local/bin/hbbs
          ENV TZ=Asia/Shanghai
          EXPOSE 21115 21116 21118
          ENTRYPOINT ["/usr/local/bin/hbbs"]
          EOF

          cat > docker/ctx-hbbr/Dockerfile <<'EOF'
          FROM scratch
          COPY hbbr /usr/local/bin/hbbr
          ENV TZ=Asia/Shanghai
          EXPOSE 21117 21119
          ENTRYPOINT ["/usr/local/bin/hbbr"]
          EOF

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hbbs
        uses: docker/build-push-action@v6
        with:
          context: docker/ctx-hbbs
          platforms: linux/${{ matrix.job.arch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-hbbs:${{ github.ref_name }}-${{ matrix.job.arch }}
            ghcr.io/${{ github.repository }}-hbbs:latest-${{ matrix.job.arch }}

      - name: Build and push hbbr
        uses: docker/build-push-action@v6
        with:
          context: docker/ctx-hbbr
          platforms: linux/${{ matrix.job.arch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-hbbr:${{ github.ref_name }}-${{ matrix.job.arch }}
            ghcr.io/${{ github.repository }}-hbbr:latest-${{ matrix.job.arch }}

      - name: Publish binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.job.arch == 'amd64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            RustDesk 自建服务端（定制版）${{ github.ref_name }}

            ## 二进制
            - `hbbs` —— ID/会合服务器（21115/21116/21118）
            - `hbbr` —— 中继服务器（21117/21119）
            - `rustdesk-utils` —— 辅助工具

            均为 musl 静态链接，可直接在主流 Linux 发行版运行。

            ## Docker 镜像
            ```
            docker pull ghcr.io/${{ github.repository }}-hbbs:${{ github.ref_name }}-amd64
            docker pull ghcr.io/${{ github.repository }}-hbbr:${{ github.ref_name }}-amd64
            ```

            ## 启动示例（含集群 agent）
            ```
            # hbbs
            RD_API_SERVER=https://<api-server> RD_NODE_KEY=<key> \
            RD_NODE_ADDR=<公网IP>:21116 RD_NODE_LAN_ADDR=<内网IP>:21116 \
            RD_NODE_REGION=GX ./hbbs -r "relay1:21117,relay2:21117" --must-login Y

            # hbbr
            RD_API_SERVER=https://<api-server> RD_NODE_KEY=<key> \
            RD_NODE_ADDR=<公网IP>:21117 RD_NODE_LAN_ADDR=<内网IP>:21117 \
            RD_NODE_REGION=GX ./hbbr -k <key>
            ```

            环境变量 `RD_API_SERVER` 为空时集群功能自动关闭，行为与原始版本一致。
          files: |
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/rustdesk-utils
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows binaries
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build hbbs / hbbr (Windows)
        run: cargo build --release --target x86_64-pc-windows-msvc --bin hbbs --bin hbbr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/hbbs.exe
            target/x86_64-pc-windows-msvc/release/hbbr.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            target/x86_64-pc-windows-msvc/release/hbbs.exe
            target/x86_64-pc-windows-msvc/release/hbbr.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
